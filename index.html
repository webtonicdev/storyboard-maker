<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storyboard Prompt Maker for Google Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
    color: #e8e8f0;
    min-height: 100vh;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #9ca3af;
    font-size: 14px;
  }
  .panels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .panel {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 16px;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
  }
  .panel:hover {
    border-color: rgba(167, 139, 250, 0.4);
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .panel-number {
    font-size: 14px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 0.5px;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #6b7280;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .delete-btn:hover {
    color: #f87171;
    background: rgba(248, 113, 113, 0.1);
  }
  .panel textarea {
    width: 100%;
    min-height: 120px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 12px;
    color: #e8e8f0;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .panel textarea:focus {
    outline: none;
    border-color: #a78bfa;
  }
  .panel textarea::placeholder {
    color: #6b7280;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-add {
    background: rgba(167, 139, 250, 0.15);
    color: #a78bfa;
    border: 1px solid rgba(167, 139, 250, 0.3);
  }
  .btn-add:hover {
    background: rgba(167, 139, 250, 0.25);
    transform: translateY(-1px);
  }
  .btn-copy {
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    color: #fff;
    font-weight: 600;
  }
  .btn-copy:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(167, 139, 250, 0.3);
  }
  .btn-copy.copied {
    background: linear-gradient(90deg, #10b981, #059669);
  }
  .btn-clear {
    background: rgba(255, 255, 255, 0.05);
    color: #9ca3af;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .btn-clear:hover {
    background: rgba(248, 113, 113, 0.1);
    color: #f87171;
    border-color: rgba(248, 113, 113, 0.3);
  }
  .preview {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .preview-title {
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .panel-count {
    font-size: 12px;
    color: #a78bfa;
    background: rgba(167, 139, 250, 0.15);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .preview-content {
    font-family: 'SF Mono', Monaco, Consolas, monospace;
    font-size: 13px;
    color: #d1d5db;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
    padding: 12px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #10b981;
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
  @media (max-width: 640px) {
    body { padding: 16px; }
    h1 { font-size: 22px; }
    .panels-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Storyboard Prompt Maker</h1>
    <p class="subtitle">For Google Flow — describe each scene, then copy the final prompt</p>
  </header>

  <div class="panels-grid" id="panelsGrid"></div>

  <div class="controls">
    <button class="btn-add" id="addBtn">
      <span style="font-size: 18px;">+</span> Add Panel
    </button>
    <button class="btn-clear" id="clearBtn">Clear All</button>
    <button class="btn-copy" id="copyBtn">
      <span>📋</span> Copy Prompt
    </button>
  </div>

  <div class="preview">
    <div class="preview-header">
      <span class="preview-title">Prompt Preview</span>
      <span class="panel-count" id="panelCount">6 Panels</span>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
  let panels = [];
  let nextId = 1;

  const grid = document.getElementById('panelsGrid');
  const previewContent = document.getElementById('previewContent');
  const panelCount = document.getElementById('panelCount');
  const addBtn = document.getElementById('addBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');

  function init() {
    for (let i = 0; i < 6; i++) addPanel(false);
    render();
  }

  function addPanel(doRender = true) {
    panels.push({ id: nextId++, text: '' });
    if (doRender) render();
  }

  function deletePanel(id) {
    if (panels.length <= 1) return;
    panels = panels.filter(p => p.id !== id);
    render();
  }

  function updatePanel(id, text) {
    const p = panels.find(p => p.id === id);
    if (p) {
      p.text = text;
      updatePreview();
    }
  }

  function render() {
    grid.innerHTML = '';
    panels.forEach((panel, idx) => {
      const el = document.createElement('div');
      el.className = 'panel';
      el.innerHTML = `
        <div class="panel-header">
          <span class="panel-number">PANEL ${idx + 1}</span>
          <button class="delete-btn" data-id="${panel.id}" title="Delete panel">×</button>
        </div>
        <textarea placeholder="Describe the scene in this panel…" data-id="${panel.id}">${escapeHtml(panel.text)}</textarea>
      `;
      grid.appendChild(el);
    });

    grid.querySelectorAll('textarea').forEach(t => {
      t.addEventListener('input', e => {
        updatePanel(parseInt(e.target.dataset.id), e.target.value);
      });
    });
    grid.querySelectorAll('.delete-btn').forEach(b => {
      b.addEventListener('click', e => {
        deletePanel(parseInt(e.target.dataset.id));
      });
    });

    updatePreview();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function buildPrompt() {
    const scenes = panels
      .map((p, i) => `Panel ${i + 1}: ${p.text.trim() || '[empty]'}`)
      .join('\n');
    const n = panels.length;
    return `${scenes}\n\nUsing the above scenes, create a ${n} Panels 16:9 storyboard where each panel is explained for what scene it is performing.`;
  }

  function updatePreview() {
    previewContent.textContent = buildPrompt();
    panelCount.textContent = `${panels.length} Panel${panels.length === 1 ? '' : 's'}`;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  addBtn.addEventListener('click', () => addPanel());

  clearBtn.addEventListener('click', () => {
    panels.forEach(p => p.text = '');
    render();
  });

  copyBtn.addEventListener('click', async () => {
    const text = buildPrompt();
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = '<span>✓</span> Copied!';
    showToast('Prompt copied to clipboard!');
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '<span>📋</span> Copy Prompt';
    }, 2000);
  });

  init();
</script>
</body>
</html>
